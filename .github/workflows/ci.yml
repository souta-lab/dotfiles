name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check install script
        run: bash -n install.sh
      - name: Verify every file in README Contents table exists
        run: |
          grep -oP '(?<=`)(config/[^`]+)(?=`)' README.md | sort -u | while read -r f; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all contents files exist"
